# ============================================================
# Service + HPA da aplicação meteo-api
# ============================================================
---
apiVersion: v1
kind: Service
metadata:
  name: meteo-api
  labels:
    app: meteo-api
spec:
  type: ClusterIP
  selector:
    app: meteo-api
  ports:
    - name: http
      port: 80
      targetPort: 8080

---
# ============================================================
# Horizontal Pod Autoscaler
# Alvo: manter uso médio de CPU em 50% do request (100m).
# Limites: 2 a 5 pods.
# Métrica: resource.cpu (exige requests de CPU definidos no Deployment)
# ============================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meteo-api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meteo-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 50
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
